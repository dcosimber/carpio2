project:
  type: book
  output-dir: docs
  resources:
    - assets/
    - data/
    - figures/
    - tables/
    - multiqc/

lang: es

book:
  title: "Proyecto Carpio"
  site-url: "https://dcosimber.github.io/carpio2/"
  repo-url: "https://github.com/dcosimber/carpio2"
  repo-actions: [source]
  sidebar:
    search: true
  author:
    - name: Daniel Costas Imbernón
      orcid: 0000-0003-4384-8469
      email: daniel.costas.imbernon@gmail.com
      affiliations:
        - name: Grupo de Microbiología e Infectología, Instituto de Investigación Sanitaria Galicia Sur (IISGS)
  date: last-modified
  chapters:
    - index.qmd
    - chapters/01_introduccion.qmd
    - chapters/02_diseno_experimental.qmd
    - chapters/03_flujo_bioinformatico.qmd
    - chapters/04_control_calidad_preprocesamiento.qmd
    - chapters/05_dada2_inferencia_asv.qmd
    - chapters/06_taxonomia_controles.qmd
    - chapters/07_reproducibilidad_ensayos.qmd
    - chapters/08_resultados_microbiologicos.qmd
    - chapters/09_asociaciones_clinicas.qmd
    - chapters/10_conclusiones.qmd
    - chapters/11_referencias.qmd
  appendices:
    - appendices/reproducibility.qmd
    - appendices/data_availability.qmd

bibliography: references.bib
link-citations: true

format:
  html:
    toc: true
    toc-depth: 3
    toc-location: right
    tbl-cap-location: top
    fig-cap-location: bottom
    number-sections: true
    smooth-scroll: true
    anchor-sections: true
    citations-hover: true
    link-external-newwindow: true
    lightbox:
      match: auto
      effect: zoom
      desc-position: bottom
    css: styles.css
    theme:
      light: cosmo
      dark: darkly

editor: visual
